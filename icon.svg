<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景のグラデーション: 落ち着いたダークカラー -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    
    <!-- 影の設定: 立体感を出す -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- アイコンの本体（macOSアプリ特有の丸角四角形） -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#bgGradient)"/>

  <!-- 枠線（ボーダー）: 少し明るくして高級感を出す -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="none" stroke="#444444" stroke-width="20" opacity="0.5"/>

  <!-- タイリングウィンドウのデザイン群 -->
  <g transform="translate(162, 162)">
    <!-- メインウィンドウ（左側: くすみティール） -->
    <rect x="0" y="0" width="335" height="700" rx="25" fill="#77c2ba" filter="url(#dropShadow)"/>
    
    <!-- サブウィンドウ1（右上: くすみピンク） -->
    <rect x="365" y="0" width="335" height="335" rx="25" fill="#d2838b" filter="url(#dropShadow)"/>
    
    <!-- サブウィンドウ2（右下: グレー） -->
    <rect x="365" y="365" width="335" height="335" rx="25" fill="#5c6b7f" filter="url(#dropShadow)"/>
  </g>
</svg>
